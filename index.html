<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Play Button Studio v2.0</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0b0f19;
            --card-bg: #111827;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1f2937;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 1.35rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .control-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="file"], select {
            width: 100%;
            padding: 0.75rem;
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="file"]:hover, select:hover {
            border-color: var(--primary);
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--primary);
        }

        .preview-container {
            position: relative;
            width: 100%;
            max-height: 400px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 1.5rem 0;
            border: 1px solid var(--border);
        }

        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 0.875rem;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pro Play Button Studio v2.0</h1>

        <!-- Unggah Gambar -->
        <div class="control-group">
            <label for="uploadImage">Pilih Gambar Latar:</label>
            <input type="file" id="uploadImage" accept="image/*">
        </div>

        <!-- Pilihan Gaya Tombol Play Pro (15 Variasi) -->
        <div class="control-group">
            <label for="styleSelect">Pilih Gaya Tombol Play (Pro Styles):</label>
            <select id="styleSelect">
                <option value="1">1. YouTube Classic (Red Rounded Badge + White Play)</option>
                <option value="2">2. Netflix Style (Dark Red Circle + Clean Play)</option>
                <option value="3">3. Modern Glassmorphism (Frosted Glass + White Play)</option>
                <option value="4">4. Cyberpunk Neon Cyan (Glow Effect + Sharp Play)</option>
                <option value="5">5. Neon Crimson Red (Aggressive Glow Play)</option>
                <option value="6">6. Minimalist Solid White (Clean Solid Circle)</option>
                <option value="7">7. Dark Luxury Gold (Premium Metallic Look)</option>
                <option value="8">8. Emerald Green Pro (High Trust Trust Badge)</option>
                <option value="9">9. Ultra Thin Border Ring (Transparent Center)</option>
                <option value="10">10. Solid Black Minimal (Stealth Dark Theme)</option>
                <option value="11">11. Vibrant Gradient Sunset (Orange-Pink Pro)</option>
                <option value="12">12. Electric Blue Matrix (Tech Vibe)</option>
                <option value="13">13. Soft Pastel Blur (Modern Aesthetic)</option>
                <option value="14">14. Double Ring Tech (Futuristic HUD Style)</option>
                <option value="15">15. Drop Shadow Pop (High CTR Thumbnail Style)</option>
            </select>
        </div>

        <!-- Ukuran Tombol Play -->
        <div class="control-group">
            <label for="sizeRange">Ukuran Tombol Play:</label>
            <div class="range-container">
                <input type="range" id="sizeRange" min="30" max="180" value="80">
                <span id="sizeVal">80px</span>
            </div>
        </div>

        <!-- Area Preview -->
        <div class="preview-container">
            <canvas id="imageCanvas"></canvas>
        </div>

        <!-- Tombol Download -->
        <button id="downloadBtn" class="btn">Unduh Hasil Thumbnail (PNG)</button>
    </div>

    <script>
        const uploadImage = document.getElementById('uploadImage');
        const styleSelect = document.getElementById('styleSelect');
        const sizeRange = document.getElementById('sizeRange');
        const sizeVal = document.getElementById('sizeVal');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentImage = new Image();
        let imageLoaded = false;

        function loadDefaultImage() {
            currentImage.src = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=800&auto=format&fit=crop';
            currentImage.crossOrigin = "anonymous";
            currentImage.onload = function() {
                imageLoaded = true;
                drawCanvas();
            }
        }

        loadDefaultImage();

        uploadImage.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentImage.src = event.target.result;
                    currentImage.onload = function() {
                        imageLoaded = true;
                        drawCanvas();
                    }
                }
                reader.readAsDataURL(file);
            }
        });

        styleSelect.addEventListener('change', () => { if (imageLoaded) drawCanvas(); });
        sizeRange.addEventListener('input', function() {
            sizeVal.textContent = this.value + 'px';
            if (imageLoaded) drawCanvas();
        });

        function drawCanvas() {
            canvas.width = currentImage.naturalWidth;
            canvas.height = currentImage.naturalHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(currentImage, 0, 0);

            const scaleFactor = canvas.width / 800;
            const baseSize = parseInt(sizeRange.value);
            const playSize = baseSize * Math.max(scaleFactor, 0.4);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const style = styleSelect.value;

            ctx.save();

            // Render berdasarkan 15 pilihan gaya pro
            switch(style) {
                case '1': // YouTube Classic
                    drawCircle(centerX, centerY, playSize, '#ff0000', 'rgba(0,0,0,0.3)', 0, 0);
                    drawPlayIcon(centerX, centerY + (playSize*0.05), playSize * 0.55, '#ffffff');
                    break;
                case '2': // Netflix Style
                    drawCircle(centerX, centerY, playSize, '#b91c1c', 'rgba(0,0,0,0.5)', 0, 0);
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#ffffff');
                    break;
                case '3': // Glassmorphism
                    drawCircle(centerX, centerY, playSize, 'rgba(255, 255, 255, 0.25)', 'rgba(0,0,0,0.3)', 2 * scaleFactor, 'rgba(255,255,255,0.6)');
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#ffffff');
                    break;
                case '4': // Cyberpunk Cyan Glow
                    ctx.shadowColor = '#06b6d4';
                    ctx.shadowBlur = 20 * scaleFactor;
                    drawCircle(centerX, centerY, playSize, '#090d16', '#06b6d4', 3 * scaleFactor, '#06b6d4');
                    ctx.shadowBlur = 0; // reset
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#06b6d4');
                    break;
                case '5': // Neon Crimson Glow
                    ctx.shadowColor = '#ef4444';
                    ctx.shadowBlur = 25 * scaleFactor;
                    drawCircle(centerX, centerY, playSize, '#110505', '#ef4444', 3 * scaleFactor, '#ef4444');
                    ctx.shadowBlur = 0;
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#ef4444');
                    break;
                case '6': // Minimalist Solid White
                    drawCircle(centerX, centerY, playSize, '#ffffff', 'rgba(0,0,0,0.4)', 0, 0);
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#0f172a');
                    break;
                case '7': // Dark Luxury Gold
                    drawCircle(centerX, centerY, playSize, '#1c1917', '#d97706', 3 * scaleFactor, '#d97706');
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#fbbf24');
                    break;
                case '8': // Emerald Green Pro
                    drawCircle(centerX, centerY, playSize, '#065f46', 'rgba(0,0,0,0.4)', 2 * scaleFactor, '#34d399');
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#ffffff');
                    break;
                case '9': // Ultra Thin Border Ring
                    drawCircle(centerX, centerY, playSize, 'rgba(0,0,0,0.4)', 'rgba(255,255,255,0.8)', 2 * scaleFactor, 'rgba(255,255,255,0.8)');
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#ffffff');
                    break;
                case '10': // Solid Black Minimal
                    drawCircle(centerX, centerY, playSize, '#090d16', 'rgba(0,0,0,0.6)', 2 * scaleFactor, '#334155');
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#f8fafc');
                    break;
                case '11': // Gradient Sunset
                    const grad1 = ctx.createLinearGradient(centerX - playSize, centerY - playSize, centerX + playSize, centerY + playSize);
                    grad1.addColorStop(0, '#f97316');
                    grad1.addColorStop(1, '#db2777');
                    drawCustomFillCircle(centerX, centerY, playSize, grad1, 'rgba(0,0,0,0.4)');
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#ffffff');
                    break;
                case '12': // Electric Blue Matrix
                    const grad2 = ctx.createLinearGradient(centerX - playSize, centerY - playSize, centerX + playSize, centerY + playSize);
                    grad2.addColorStop(0, '#3b82f6');
                    grad2.addColorStop(1, '#1d4ed8');
                    drawCustomFillCircle(centerX, centerY, playSize, grad2, 'rgba(0,0,0,0.5)');
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#ffffff');
                    break;
                case '13': // Soft Pastel Blur
                    drawCircle(centerX, centerY, playSize, 'rgba(255,255,255,0.85)', 'rgba(0,0,0,0.2)', 0, 0);
                    drawPlayIcon(centerX, centerY, playSize * 0.5, '#4f46e5');
                    break;
                case '14': // Double Ring Tech
                    drawCircle(centerX, centerY, playSize, '#0f172a', 'rgba(0,0,0,0.5)', 2 * scaleFactor, '#3b82f6');
                    // Ring kedua di dalam
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, playSize * 0.8, 0, 2 * Math.PI);
                    ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
                    ctx.lineWidth = 1 * scaleFactor;
                    ctx.stroke();
                    drawPlayIcon(centerX, centerY, playSize * 0.45, '#3b82f6');
                    break;
                case '15': // Drop Shadow Pop (High CTR)
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                    ctx.shadowBlur = 15 * scaleFactor;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 8 * scaleFactor;
                    drawCircle(centerX, centerY, playSize, '#dc2626', 'transparent', 0, 0);
                    ctx.shadowBlur = 0; // reset
                    ctx.shadowOffsetY = 0;
                    drawPlayIcon(centerX, centerY + (playSize*0.04), playSize * 0.55, '#ffffff');
                    break;
            }

            ctx.restore();
        }

        function drawCircle(x, y, radius, fillColor, shadowColor, lineWidth, strokeColor) {
            if (shadowColor && shadowColor !== 'transparent') {
                ctx.save();
                ctx.shadowColor = shadowColor;
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 4;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = fillColor;
                ctx.fill();
                ctx.restore();
            } else {
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.fillStyle = fillColor;
                ctx.fill();
            }

            if (lineWidth > 0) {
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = strokeColor;
                ctx.stroke();
            }
        }

        function drawCustomFillCircle(x, y, radius, fillStyle, shadowColor) {
            ctx.save();
            ctx.shadowColor = shadowColor;
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 4;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = fillStyle;
            ctx.fill();
            ctx.restore();
        }

        function drawPlayIcon(x, y, size, color) {
            ctx.beginPath();
            const width = size * 0.9;
            const height = size;
            
            // Sedikit digeser ke kanan secara visual agar persis di tengah lingkaran
            const offsetX = width * 0.1;

            ctx.moveTo(x - width / 2 + offsetX, y - height / 2);
            ctx.lineTo(x - width / 2 + offsetX, y + height / 2);
            ctx.lineTo(x + width / 2 + offsetX, y);
            ctx.closePath();

            ctx.fillStyle = color;
            ctx.fill();
        }

        downloadBtn.addEventListener('click', function() {
            if (!imageLoaded) return;
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'pro-thumbnail-play.png';
            link.href = dataURL;
            link.click();
        });
    </script>
</body>
</html>
